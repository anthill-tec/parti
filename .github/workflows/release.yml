# Scaffolded by modelb-axi (Model B release workflow). Extended by hand for
# Parti (owner, 2026-11-22), borrowing from Crucible's release.yml: CI on
# develop and pull requests, one pinned bun version, hardened checkouts,
# retried installs, a zizmor audit of this file. modelb-axi leaves a
# hand-edited file alone.
#
# Release workflow: the project's test jobs gate every publish.
#
# - A develop push or a pull request runs the tests (CI). Nothing publishes.
#
# The test jobs run in every run. They carry no `if:` and must never be
# scoped: `needs:` orders jobs only within one run, and a publish that
# needs a skipped job is itself skipped, silently.
#
# - A release or hotfix push runs the tests and the rehearsal.
# - A master push runs the tests and create-release, which releases the
#   version tag at HEAD.
# - A published release runs the tests.
# Every publish needs the tests.
#
# Recovery: when the master run finds no version tag at HEAD, dispatch
# the workflow on master.
#
# A red run: when the master run or the release run fails its tests,
# nothing publishes. Re-run the failed jobs; a real failure is fixed on
# a hotfix branch.
#
# One-time setup:
# - repository secret RELEASE_PAT: fine-grained, this repository only,
#   Contents read/write.

name: release

on:
  push:
    # develop: everyday CI. master, release/**, hotfix/**: the release path.
    # None adds a publish path: create-release needs master, and the
    # rehearsal needs a release or hotfix branch.
    branches: [develop, master, "release/**", "hotfix/**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# THE bun version, written once, used by every job that installs bun (from
# Crucible, CR-CRU-137). An unpinned setup-bun installs the latest, and the
# suite then runs on a version it was never measured against. A bump is a
# deliberate commit.
env:
  BUN_VERSION: "1.4.4"

jobs:
  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "${{ env.BUN_VERSION }}"
          no-cache: true
      # Each attempt under `timeout`, one retry, a step limit above both
      # (from Crucible).
      - name: Install the locked dependencies
        timeout-minutes: 12
        run: |
          attempt=1
          until timeout 5m bun install --frozen-lockfile
          do
            [ "$attempt" -lt 2 ] || exit 1
            attempt=$((attempt + 1))
            echo "::warning::bun install failed; attempt $attempt of 2"
          done
      - name: Run the tests
        run: bun test

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      # The workflow audits itself (from Crucible): no unpinned action, no
      # template injection, no persisted credentials, no cache poisoning.
      - name: zizmor audit of this workflow
        run: uvx zizmor@1.32.0 --offline .github/workflows/release.yml
      - name: Run the tests
        run: python -m unittest discover -s tests -t .

  create-release:
    needs: [test-bun, test-python]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The version tag at HEAD
        id: tag
        run: |
          tags=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          count=$(printf '%s' "$tags" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::more than one version tag at HEAD: $(echo $tags)"
            exit 1
          fi
          if [ -z "$tags" ]; then
            echo "::notice::no version tag at HEAD — nothing to release"
          fi
          echo "tag=$tags" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 .github/scripts/changelog_section.py CHANGELOG.md "$TAG" > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi

  rehearse:
    needs: [test-bun, test-python]
    if: >-
      (startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/heads/hotfix/')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Stamp the dev version and check the release notes
        run: |
          version=$(python3 .github/scripts/stamp_version.py stamp "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")
          python3 .github/scripts/changelog_section.py CHANGELOG.md "$version" > /dev/null
